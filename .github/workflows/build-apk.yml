name: Build Android APK (CogniAgent v2)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          # Pre-accept official Android SDK licenses to prevent any interactive prompt
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          
          # Find sdkmanager in pre-installed cmdline-tools and accept all licenses
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            echo "Using sdkmanager at: $SDK_MANAGER"
            yes | "$SDK_MANAGER" --licenses || true
          fi

      - name: 🟢 Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM dependencies
        run: |
          npm ci || npm install

      - name: 🏗️ Build React / Vite App
        run: |
          npm run build

      - name: ⚡ Initialize & Sync Capacitor Android
        run: |
          # Add android platform if not already generated
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🛡️ Inject Android Permissions & Overlay Flags
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting hardware & system permissions into $MANIFEST..."
            python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.CAMERA",
              "android.permission.FLASHLIGHT",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
              "android.permission.SYSTEM_ALERT_WINDOW"
          ]

          lines = []
          for perm in permissions:
              perm_line = f'    <uses-permission android:name="{perm}" />'
              if perm not in content:
                  lines.append(perm_line)

          if lines:
              idx = content.find("<application")
              if idx != -1:
                  new_content = content[:idx] + "\n".join(lines) + "\n\n    " + content[idx:]
                  with open(manifest_path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print("Permissions successfully injected!")
              else:
                  print("Could not find <application> tag")
          else:
              print("All permissions already present.")
          EOF
          fi

      - name: 🔨 Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Prepare Output APK Artifact
        run: |
          mkdir -p output-apk
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output-apk/CogniAgent-v2-debug.apk
            echo "APK generated successfully: output-apk/CogniAgent-v2-debug.apk"
            ls -lh output-apk/CogniAgent-v2-debug.apk
          else
            echo "Error: APK not found at $APK_PATH"
            find android/app/build -name "*.apk" || true
            exit 1
          fi

      - name: 🚀 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: CogniAgent-v2-debug-apk
          path: output-apk/CogniAgent-v2-debug.apk
          retention-days: 14

      - name: 📝 Job Summary
        run: |
          echo "### 🚀 Sukces kompilacji APK dla Huawei P30 Pro!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pomyślnie zbudowano plik instalacyjny: **CogniAgent-v2-debug.apk**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Jak zainstalować na telefonie:" >> $GITHUB_STEP_SUMMARY
          echo "1. Wejdź w zakładkę **Actions** tego workflow na GitHubie." >> $GITHUB_STEP_SUMMARY
          echo "2. Na dole strony w sekcji **Artifacts** kliknij i pobierz **CogniAgent-v2-debug-apk**." >> $GITHUB_STEP_SUMMARY
          echo "3. Prześlij plik APK na swój telefon (lub pobierz bezpośrednio przez przeglądarkę telefonu)." >> $GITHUB_STEP_SUMMARY
          echo "4. Otwórz plik na Huawei P30 Pro i zatwierdź instalację z nieznanych źródeł." >> $GITHUB_STEP_SUMMARY
